# `npm run check` is 300-odd assertions, a migration checker and a backup
# checker, and until this file existed nothing ran them but the author
# remembering to.
name: check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The shared libraries Electron needs to start headless. `xvfb` itself is
      # already on the runner, and `check:app` wraps itself in `xvfb-run`.
      - name: Install Electron's runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgbm1 libasound2t64 libnss3

      # `postinstall` rebuilds better-sqlite3 against Electron's headers.
      - run: npm ci

      - run: npm run check
