<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lock Screen Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="cities/medellin.js"></script>

<style>
  :root {
    --bg: #0f110f;
    --surface: rgba(21, 25, 23, 0.78);
    --accent: #69b48a;
    --accent-line: rgba(105, 180, 138, 0.55);
    --text: #e6e8e6;
    --dim: #717672;
    --border: #222824;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { z-index: 0; }
  #c { z-index: 1; }
  .bar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
    font: 11px "IBM Plex Mono", monospace; max-width: calc(100% - 32px);
  }
  .bar button {
    background: rgba(15, 17, 15, 0.85); color: var(--dim); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 10px; cursor: pointer; font: inherit; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .bar button.on { color: var(--text); border-color: var(--accent-line); background: rgba(105, 180, 138, 0.1); }
  .bar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

  /* The unlock box, in each of the layouts on trial. */
  .panel {
    position: fixed; z-index: 3; width: 280px; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
    border: 1px solid var(--accent-line); border-radius: 4px; background: var(--surface);
    backdrop-filter: blur(8px); box-shadow: 0 0 40px rgba(105, 180, 138, 0.08);
    transition: all 400ms ease;
  }
  .panel .logo { font: 600 15px "IBM Plex Mono", monospace; letter-spacing: 0.18em; color: var(--accent); }
  .panel .label { font: 600 10.5px "IBM Plex Mono", monospace; letter-spacing: 0.04em; text-transform: uppercase; color: var(--dim); }
  .panel .input { height: 34px; border: 1px solid #2d342f; border-radius: 2px; background: #0b0c0b; }
  .panel .btn { height: 28px; border-radius: 2px; background: var(--accent); color: #0b0c0b; font: 13px "Chakra Petch", sans-serif; display: flex; align-items: center; padding-left: 10px; }

  .quote {
    position: fixed; z-index: 2; max-width: 560px; font: 13.5px/1.65 "IBM Plex Mono", monospace; color: rgba(105, 180, 138, 0.78);
    animation: quote 32s ease-in-out infinite; transition: all 400ms ease; pointer-events: none;
  }
  .quote small { display: block; margin-top: 8px; font-size: 10.5px; letter-spacing: 0.08em; color: rgba(105, 180, 138, 0.45); }
  @keyframes quote { 0% { opacity: 0 } 7% { opacity: 1 } 85% { opacity: 1 } 95%, 100% { opacity: 0 } }

  /* centre: the box in the middle, the quote low beneath everything. */
  body[data-layout='center'] .panel { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  body[data-layout='center'] .quote { left: 50%; bottom: 64px; transform: translateX(-50%); text-align: center; }
  /* right rail: box and quote stacked on the right, the visual shifted left. */
  body[data-layout='right'] .panel { right: 7%; top: 50%; transform: translateY(-50%); }
  body[data-layout='right'] .quote { right: 7%; top: calc(50% + 130px); max-width: 300px; text-align: left; }
  /* left rail: the mirror image. */
  body[data-layout='left'] .panel { left: 7%; top: 50%; transform: translateY(-50%); }
  body[data-layout='left'] .quote { left: 7%; top: calc(50% + 130px); max-width: 300px; text-align: left; }
  /* low: box near the bottom edge, quote along the top under the HUD. */
  body[data-layout='low'] .panel { left: 50%; bottom: 72px; transform: translateX(-50%); }
  body[data-layout='low'] .quote { left: 50%; top: 92px; transform: translateX(-50%); text-align: center; max-width: 720px; }
  /* corner: a small box bottom right, quote bottom left, the whole screen to the visual. */
  body[data-layout='corner'] .panel { right: 56px; bottom: 64px; width: 240px; padding: 18px; }
  body[data-layout='corner'] .quote { left: 56px; bottom: 64px; max-width: 420px; text-align: left; }
  /* Minimal: one slim strip, the name and the field. Enter unlocks. */
  body[data-layout^='min'] .panel { width: 320px; padding: 9px 12px; flex-direction: row; align-items: center; gap: 12px; background: rgba(15, 17, 15, 0.7); }
  body[data-layout^='min'] .panel .logo { font-size: 11px; letter-spacing: 0.22em; }
  body[data-layout^='min'] .panel .label, body[data-layout^='min'] .panel .btn { display: none; }
  body[data-layout^='min'] .panel .input { flex: 1; height: 28px; }
  body[data-layout='min-low'] .panel { left: 50%; bottom: 70px; transform: translateX(-50%); }
  body[data-layout='min-low'] .quote { left: 56px; bottom: 64px; max-width: 400px; text-align: left; }
  body[data-layout='min-right'] .panel { right: 64px; top: 50%; transform: translateY(-50%); }
  body[data-layout='min-right'] .quote { left: 50%; bottom: 64px; transform: translateX(-50%); text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body data-layout="min-low">
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<div class="bar" id="bar"></div>
<div class="panel" id="panel">
  <div class="logo">NEXUS</div>
  <div class="label">Locked</div>
  <div class="input"></div>
  <div class="btn">Unlock</div>
</div>
<div class="quote hidden" id="quote">
  You must be ready to burn yourself in your own flame; how could you become new if you have not first become ashes?
  <small>NIETZSCHE · THUS SPOKE ZARATHUSTRA</small>
</div>
<script>
'use strict'
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
const ACCENT = { r: 105, g: 180, b: 138 }
const BG = { r: 15, g: 17, b: 15 }
const rgba = (c, a) => `rgba(${c.r},${c.g},${c.b},${a})`
const A = (a) => rgba(ACCENT, a)
const MONO = '"IBM Plex Mono", monospace'

let W = 0, H = 0
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2)
  W = innerWidth; H = innerHeight
  canvas.width = W * dpr; canvas.height = H * dpr
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  if (gl) gl.resize()
}
let gl = null
addEventListener('resize', resize); resize()

function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296) }
const ease = (t) => (t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t))
const clamp01 = (t) => Math.max(0, Math.min(1, t))
const lerp = (a, b, t) => a + (b - a) * t
const pad = (n) => String(n).padStart(2, '0')

/* Where the visual should centre, away from the box: set by the layout. */
let layout = 'min-low'
const focusX = () => ({ center: 0.5, right: 0.4, left: 0.6, low: 0.5, corner: 0.48, 'min-low': 0.5, 'min-right': 0.44 })[layout] * W
const focusY = () => ({ center: 0.47, right: 0.48, left: 0.48, low: 0.42, corner: 0.46, 'min-low': 0.44, 'min-right': 0.46 })[layout] * H

/* ---------- value noise ---------- */
const PERM = (() => { const r = seeded(99); const p = Array.from({ length: 256 }, (_, i) => i); for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]] } return p.concat(p) })()
const GRAD = Array.from({ length: 256 }, (_, i) => [Math.cos((i / 256) * Math.PI * 2), Math.sin((i / 256) * Math.PI * 2)])
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi
  const g = (ix, iy, dx, dy) => { const v = GRAD[PERM[(PERM[ix & 255] + iy) & 255]]; return v[0] * dx + v[1] * dy }
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf)
  return lerp(lerp(g(xi, yi, xf, yf), g(xi + 1, yi, xf - 1, yf), u), lerp(g(xi, yi + 1, xf, yf - 1), g(xi + 1, yi + 1, xf - 1, yf - 1), u), v)
}
const fbm = (x, y) => noise(x, y) * 0.6 + noise(x * 2.1, y * 2.1) * 0.28 + noise(x * 4.3, y * 4.3) * 0.12

/* ---------- shared HUD ---------- */
let credit = ''
function hud(t, footer) {
  const inset = 24, arm = 26
  ctx.strokeStyle = A(0.45); ctx.lineWidth = 1; ctx.beginPath()
  for (const [cx, cy, sx, sy] of [[inset, inset, 1, 1], [W - inset, inset, -1, 1], [inset, H - inset, 1, -1], [W - inset, H - inset, -1, -1]]) {
    ctx.moveTo(cx + 0.5, cy + sy * arm); ctx.lineTo(cx + 0.5, cy + 0.5); ctx.lineTo(cx + sx * arm, cy + 0.5)
  }
  ctx.stroke()
  const now = new Date(), status = 'NEXUS // VAULT SEALED'
  ctx.font = `11px ${MONO}`; ctx.fillStyle = A(0.6); ctx.textBaseline = 'top'
  ctx.textAlign = 'left'; ctx.fillText(status, inset + 12, inset + 10)
  if (Math.floor(t / 600) % 2 === 0) ctx.fillRect(inset + 18 + ctx.measureText(status).width, inset + 10, 6, 11)
  ctx.textAlign = 'right'; ctx.fillText(`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`, W - inset - 12, inset + 10)
  ctx.textBaseline = 'bottom'
  ctx.fillText(now.toLocaleDateString(undefined, { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase(), W - inset - 12, H - inset - 10)
  ctx.textAlign = 'left'; ctx.fillStyle = A(0.4); ctx.fillText(footer, inset + 12, H - inset - 10)
  if (credit) { ctx.font = `9.5px ${MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = A(0.3); ctx.fillText(credit.toUpperCase(), W / 2, H - inset - 10) }
}
function vignette(strength = 0.7) {
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75)
  v.addColorStop(0, rgba(BG, 0)); v.addColorStop(1, rgba(BG, strength))
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H)
}
function grid(size, alpha) {
  ctx.strokeStyle = A(alpha); ctx.lineWidth = 1; ctx.beginPath()
  for (let x = 0; x < W; x += size) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, H) }
  for (let y = 0; y < H; y += size) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5) }
  ctx.stroke()
}

/* =========================================================
   EXPLODED 3D: solid parts drawn as their edges (hidden lines
   removed), turning slowly, separating along their axis, with
   callouts projected onto the 2D layer.
   ========================================================= */
function makeGl() {
  if (!window.THREE) return null
  const el = document.getElementById('gl')
  const renderer = new THREE.WebGLRenderer({ canvas: el, antialias: true })
  renderer.setClearColor(0x0f110f, 1)
  const scene = new THREE.Scene()
  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 500)
  const api = {
    renderer, scene, camera,
    resize() {
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2))
      renderer.setSize(innerWidth, innerHeight, false)
      camera.aspect = innerWidth / innerHeight
      camera.updateProjectionMatrix()
    }
  }
  api.resize()
  return api
}
gl = makeGl()

const EDGE = new THREE.LineBasicMaterial({ color: 0x69b48a, transparent: true, opacity: 0.9 })
const EDGE_DIM = new THREE.LineBasicMaterial({ color: 0x69b48a, transparent: true, opacity: 0.35 })
const FILL = new THREE.MeshBasicMaterial({ color: 0x0f110f, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })

/**
 * The silhouette of a curved part, which its creases alone never show: the
 * back faces pushed out along their normals and drawn in green behind the
 * dark fill, so only a thin rim shows around the outline.
 */
const OUTLINE = new THREE.ShaderMaterial({
  uniforms: { opacity: { value: 0.9 }, thickness: { value: 0.045 } },
  vertexShader: 'uniform float thickness; void main() { vec3 p = position + normal * thickness; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }',
  fragmentShader: 'uniform float opacity; void main() { gl_FragColor = vec4(0.4118, 0.7059, 0.5412, opacity); }',
  side: THREE.BackSide,
  transparent: true
})
/** A solid drawn as its creases and outline: a dark fill hides what is behind it. */
const FILL_OPEN = new THREE.MeshBasicMaterial({ color: 0x0f110f, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
function solid(geometry, threshold = 24, open = false) {
  const g = new THREE.Group()
  // An open surface (a cutaway) has no outside to outline: both faces are dark.
  if (!open) g.add(new THREE.Mesh(geometry, OUTLINE))
  g.add(new THREE.Mesh(geometry, open ? FILL_OPEN : FILL))
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geometry, threshold), EDGE))
  return g
}
/** Lines that are part of the drawing but not a solid: centre lines, ridges, springs. */
function lines(points, dim = false) {
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points.map((p) => new THREE.Vector3(...p))), dim ? EDGE_DIM : EDGE)
}
/** Turn a profile about the X axis (lathe turns about Y). */
function latheX(profile, segments = 28) {
  const geo = new THREE.LatheGeometry(profile.map(([x, r]) => new THREE.Vector2(r, x)), segments)
  geo.rotateZ(-Math.PI / 2)
  return geo
}

/* ---------- geometry helpers ---------- */
/**
 * A loft along X: one cross-section ring per station, joined into a skin.
 * `section(st)` returns the ring as [y, z] points; every ring has the same
 * count. Indexed, so the outline shader gets smooth normals while the edge
 * pass still finds the ridges (grind lines, a diamond's spine).
 */
function loftX(stations, section) {
  // Always skin from -X to +X, so every loft faces outwards the same way.
  if (stations.length > 1 && stations[0].x > stations[stations.length - 1].x) stations = stations.slice().reverse()
  const rings = stations.map((st) => section(st).map(([y, z]) => [st.x, y, z]))
  const n = rings[0].length
  const pos = [], idx = []
  rings.forEach((r) => r.forEach((p) => pos.push(...p)))
  for (let i = 0; i < rings.length - 1; i++)
    for (let k = 0; k < n; k++) {
      const a = i * n + k, b = i * n + ((k + 1) % n), c = (i + 1) * n + k, d = (i + 1) * n + ((k + 1) % n)
      idx.push(a, b, c, b, d, c)
    }
  // Cap both ends with a fan from the ring's centre.
  for (const [ri, flip] of [[0, true], [rings.length - 1, false]]) {
    const r = rings[ri], cx = r.reduce((s, p) => s + p[0], 0) / n, cy = r.reduce((s, p) => s + p[1], 0) / n, cz = r.reduce((s, p) => s + p[2], 0) / n
    const c = pos.length / 3
    pos.push(cx, cy, cz)
    for (let k = 0; k < n; k++) {
      const a = ri * n + k, b = ri * n + ((k + 1) % n)
      flip ? idx.push(c, a, b) : idx.push(c, b, a)
    }
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setIndex(idx)
  g.computeVertexNormals()
  return g
}
const range = (n, f) => Array.from({ length: n }, (_, i) => f(i / (n - 1), i))
/** A flat profile in XY, extruded to `depth` and centred on z = zc. */
function slab(shape, depth, zc = 0, bevel = 0) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 20 })
  g.translate(0, 0, zc - depth / 2)
  return g
}
/** A shape from a closed list of points with optional quadratic control points: [x, y] or [cx, cy, x, y]. */
function outline(points) {
  const s = new THREE.Shape()
  points.forEach((p, i) => {
    if (i === 0) s.moveTo(p[0], p[1])
    else if (p.length === 4) s.quadraticCurveTo(p[0], p[1], p[2], p[3])
    else s.lineTo(p[0], p[1])
  })
  return s
}
const mirrorY = (pts) => pts.slice().reverse().map((p) => (p.length === 4 ? [p[0], -p[1], p[2], -p[3]] : [p[0], -p[1]]))
function hole(x, y, r) { const h = new THREE.Path(); h.absarc(x, y, r, 0, Math.PI * 2, true); return h }
function helix(x0, x1, r, turns, axis = 'x') {
  const pts = []
  for (let k = 0; k <= turns * 24; k++) {
    const a = (k / 24) * Math.PI * 2, u = x0 + ((x1 - x0) * k) / (turns * 24)
    pts.push(axis === 'x' ? [u, Math.cos(a) * r, Math.sin(a) * r] : axis === 'y' ? [Math.cos(a) * r, u, Math.sin(a) * r] : [Math.cos(a) * r, Math.sin(a) * r, u])
  }
  return lines(pts)
}
function cylX(r, len, seg = 24, x = 0) { const g = new THREE.CylinderGeometry(r, r, len, seg); g.rotateZ(Math.PI / 2); g.translate(x, 0, 0); return g }
function cylZ(r, len, seg = 32, z = 0) { const g = new THREE.CylinderGeometry(r, r, len, seg); g.rotateX(Math.PI / 2); g.translate(0, 0, z); return g }
function box(w, h, d, x = 0, y = 0, z = 0) { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); return g }
function group(...objs) { const g = new THREE.Group(); objs.forEach((o) => g.add(o.isBufferGeometry ? solid(o) : o)); return g }

/* ---------- blades ----------
   Units are centimetres, the blade along +X from the guard at 0, the
   handle along -X. Dimensions from the makers' published specs. */

/** Diamond section: the edges at ±w/2, the spine at ±t/2. Fairbairn-Sykes. */
const diamond = (st) => [[st.w / 2, 0], [0, st.t / 2], [-st.w / 2, 0], [0, -st.t / 2]]
/** Flat-ground dagger: a flat at full thickness, ground to both edges. */
const flatGround = (st) => {
  const f = st.w * (st.flat ?? 0.2)
  return [[st.w / 2, 0], [f, st.t / 2], [-f, st.t / 2], [-st.w / 2, 0], [-f, -st.t / 2], [f, -st.t / 2]]
}

/* ---------- security hardware: one axis, opened in a straight line ---------- */

/** A flat disc in the YZ plane (a wheel, a cam), from a 2D shape, `t` thick at x. */
function discX(shape, t, x) { const g = slab(shape, t, 0, 0.04); g.rotateY(Math.PI / 2); g.translate(x, 0, 0); return g }
/** A circle with a notch cut into its rim at angle `at`: a wheel's gate, a cam's nose. */
function notched(r, notchW, notchD, at = 0, hole = 0) {
  const s = new THREE.Shape(), half = Math.asin(notchW / 2 / r)
  s.absarc(0, 0, r, at + half, at + Math.PI * 2 - half, false)
  s.lineTo(Math.cos(at) * (r - notchD) + Math.sin(at) * -notchW / 2, Math.sin(at) * (r - notchD) - Math.cos(at) * -notchW / 2)
  s.lineTo(Math.cos(at) * (r - notchD) - Math.sin(at) * -notchW / 2, Math.sin(at) * (r - notchD) + Math.cos(at) * -notchW / 2)
  s.lineTo(Math.cos(at + half) * r, Math.sin(at + half) * r)
  if (hole) s.holes.push(hole0(hole))
  return s
}
const hole0 = (r) => hole(0, 0, r)

function pinCylinder() {
  // A five-pin rim cylinder. The key enters from +X; pins stack up through
  // the plug into the bible above. Opened: key out, plug out, pins lifted
  // in their order, springs above them, the clip and cam off the back.
  const parts = []
  const housing = new THREE.Group()
  housing.add(solid(latheX([[0, 0.72], [0, 1.25], [0.25, 1.4], [0.6, 1.4], [0.6, 1.25], [5.4, 1.25], [5.4, 0.72]], 48)))
  housing.add(solid(box(4.6, 1.5, 1.1, 3.1, 1.6, 0)))
  for (let i = 0; i < 5; i++) { const c = new THREE.CylinderGeometry(0.15, 0.15, 1.6, 12); c.translate(1.4 + i * 0.85, 1.55, 0); housing.add(lines(range(17, (u) => [1.4 + i * 0.85 + Math.cos(u * 6.283) * 0.15, 2.36, Math.sin(u * 6.283) * 0.15]), true)) }
  housing.position.x = -0.6
  parts.push({ name: 'HOUSING  /  BIBLE', obj: housing, e: [0, 0, 0], at: [2.0, 2.35, 0] })
  const plug = group(latheX([[0, 0.3], [0, 0.95], [0.3, 0.95], [0.3, 0.7], [5.6, 0.7], [5.6, 0.3]], 40))
  plug.add(lines([[0.31, 0.45, 0], [0.31, -0.5, 0.06], [0.31, -0.5, -0.1], [0.31, 0.45, -0.04], [0.31, 0.45, 0]]))
  plug.position.x = 5.0; plug.rotation.y = Math.PI
  parts.push({ name: 'PLUG  /  KEYWAY', obj: plug, e: [5.5, 0, 0], at: [2.0, 0.7, 0] })
  const cuts = [0.55, 0.25, 0.7, 0.35, 0.5]
  const kp = [[6.4, -0.05], [6.4, 0.55]]
  cuts.forEach((d, i) => { const x = 4.4 - i * 0.85; kp.push([x + 0.25, 0.55], [x, 0.55 - d * 0.6], [x - 0.25, 0.55]) })
  kp.push([0.2, 0.55], [-0.2, 0.2], [-0.2, -0.05], [6.4, -0.05])
  const key = group(slab(outline(kp), 0.18, 0, 0.02))
  const bow = new THREE.Shape(); bow.absarc(8.2, 0.25, 1.4, 0, Math.PI * 2, false); bow.holes.push(hole(8.8, 0.25, 0.32))
  key.add(solid(slab(bow, 0.22, 0, 0.03)), solid(box(1.2, 0.5, 0.2, 6.9, 0.25, 0)))
  key.position.set(0.3, -0.25, 0)
  parts.push({ name: 'KEY  /  5-CUT', obj: key, e: [11, 0, 0], at: [8.2, 1.65, 0] })
  const pins = new THREE.Group(), drivers = new THREE.Group(), springs = new THREE.Group()
  cuts.forEach((d, i) => {
    const x = 0.8 + i * 0.85, kl = 0.45 + d * 0.6

/* ---------- downloaded models (CC BY 4.0, credited on screen) ----------
   Each mesh of the file becomes a part; parts sharing a name keyword are one
   group. The barrel is turned to +X, the whole scaled to `size` cm. */
function importModel(cfg) {
  const model = { name: cfg.name, code: cfg.code, parts: [], span: cfg.span || 46, centre: [0, 0, 0], credit: cfg.credit, loading: true }
  const b64 = window.MODEL_GLB && window.MODEL_GLB[cfg.id]

  const bin = atob(b64), buf = new Uint8Array(bin.length)
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i)
  new THREE.GLTFLoader().parse(buf.buffer, '', (gltf) => {
    gltf.scene.updateMatrixWorld(true)

    gltf.scene.traverse((o) => { if (o.isMesh && !(cfg.skip || []).some((k) => o.name.toLowerCase().includes(k))) meshes.push({ name: o.name, geo: o.geometry.clone().applyMatrix4(o.matrixWorld) }) })
    const all = new THREE.Box3()
    meshes.forEach((m) => { m.geo.computeBoundingBox(); all.union(m.geo.boundingBox) })
    const size = all.getSize(new THREE.Vector3()), ctr = all.getCenter(new THREE.Vector3())
    const rot = new THREE.Matrix4()
    if (cfg.rotate) rot.makeRotationFromEuler(new THREE.Euler(...cfg.rotate))
    else if (size.z > size.x && size.z >= size.y) rot.makeRotationY(Math.PI / 2)
    else if (size.y > size.x && size.y > size.z) rot.makeRotationZ(Math.PI / 2)
    const k = (cfg.size || 30) / Math.max(size.x, size.y, size.z)
    const xf = new THREE.Matrix4().makeScale(k, k, k).multiply(rot).multiply(new THREE.Matrix4().makeTranslation(-ctr.x, -ctr.y, -ctr.z))
    meshes.forEach((m) => { m.geo.applyMatrix4(xf); m.geo.computeBoundingBox() })
    if (cfg.debug) meshes.forEach((m) => { const b = m.geo.boundingBox, c = b.getCenter(new THREE.Vector3()), z = b.getSize(new THREE.Vector3()); console.log('MESH', cfg.id, m.name, [c.x, c.y, c.z].map((v) => v.toFixed(1)).join(','), [z.x, z.y, z.z].map((v) => v.toFixed(1)).join(',')) })
    // Group by keyword; anything unmatched is its own part.
    const groups = new Map()
    for (const m of meshes) {
      const token = cfg.fullName ? m.name.toLowerCase() : m.name.split('_')[0].toLowerCase()
      const key = (cfg.groups || []).find(([kw]) => (cfg.exact ? token === kw : m.name.toLowerCase().includes(kw)))
      const id = key ? key[1] : (cfg.debug ? m.name : 'PART')
      if (!groups.has(id)) groups.set(id, [])
      groups.get(id).push(m)
    }
    let biggest = null, bigVol = 0
    for (const [label, ms] of groups) {
      const box = new THREE.Box3(); ms.forEach((m) => box.union(m.geo.boundingBox))
      const sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3())
      const obj = new THREE.Group(); ms.forEach((m) => { if (cfg.outline && !m.geo.attributes.normal) m.geo.computeVertexNormals(); obj.add(solid(m.geo, cfg.crease || 32, !cfg.outline)) })
      if (cfg.log) console.log('GROUP', cfg.id, label, [c.x, c.y, c.z].map((v) => v.toFixed(1)).join(','))
      const fixed = (cfg.explode || {})[label]
      const e = fixed || [c.x * 0.9, c.y * 1.6 + (Math.abs(c.y) < 1 ? 3 : 0), c.z * 2 + (Math.abs(c.z) < 0.5 ? 0 : Math.sign(c.z) * 3)]
      const part = { name: label, obj, e, at: [c.x, box.max.y, c.z] }
      if (sz.x * sz.y * sz.z > bigVol) { bigVol = sz.x * sz.y * sz.z; biggest = part }
      model.parts.push(part)
    }
    if (biggest && !(cfg.explode || {})[biggest.name]) biggest.e = [0, 0, 0]
    if (cfg.labelOnly) for (const p of model.parts) p.nolabel = !cfg.labelOnly.includes(p.name)
    model.loading = false
    shown = null
  }, (err) => { console.error(err); model.loading = 'error' })
  return model
}

/* =========================================================
   NEW 3D: two daggers and a binocular NVG, built with more
   resolution than the first attempts: smooth lofts, real bevels
   (secondary edge, grind line, spine ridge) that show as lines.
   Centimetres. Blade along +X from the guard at 0.
   ========================================================= */

/** Rounded section, n = 2 ellipse .. 4 squircle, many points so silhouettes stay smooth. */
const rounded = (n, seg = 40) => (st) =>
  range(seg + 1, (u) => u * Math.PI * 2).slice(0, seg).map((a) => {
    const c = Math.cos(a), s = Math.sin(a)
    return [Math.sign(c) * Math.pow(Math.abs(c), 2 / n) * st.w / 2, Math.sign(s) * Math.pow(Math.abs(s), 2 / n) * st.h / 2]
  })

/**
 * A blade section with a secondary edge bevel and a central spine: ten
 * facets, so the edge pass draws the grind line and the edge bevel on both
 * faces, which is what makes a blade read as sharp.
 */
const bladeSection = (st) => {
  const w = st.w / 2, t = st.t / 2, e = Math.min(0.14, w * 0.18), r = st.ridge ?? 0
  return [
    [w, 0], [w - e, t * 0.22], [r, t], [-r, t], [-(w - e), t * 0.22],
    [-w, 0], [-(w - e), -t * 0.22], [-r, -t], [r, -t], [w - e, -t * 0.22]
  ]
}

/** A blade loft from a width profile and a thickness profile over u = 0 (guard) .. 1 (tip). */
function bladeGeo(L, width, thick, ridge = 0) {
  return loftX(range(64, (u) => ({ x: u * L, w: Math.max(0.03, width(u)), t: Math.max(0.025, thick(u)), ridge: ridge * (1 - u) })), bladeSection)
}

/** A groove (fuller) drawn as its walls and rounded ends on both faces. */
function fuller(x0, x1, half, zAt) {
  const g = new THREE.Group()
  for (const side of [1, -1]) {
    const z = (x) => side * zAt(x)
    const pts = []
    range(10, (u) => pts.push([x0 + half - Math.sin(u * Math.PI / 2) * half, Math.cos(u * Math.PI / 2) * half, z(x0)]))
    for (let i = 0; i <= 20; i++) { const x = x0 + half + ((x1 - x0 - 2 * half) * i) / 20; pts.push([x, half * (i === 0 ? 1 : 1), z(x)]) }
    range(10, (u) => pts.push([x1 - half + Math.sin(u * Math.PI) * half, Math.cos(u * Math.PI) * half, z(x1)]))
    for (let i = 20; i >= 0; i--) { const x = x0 + half + ((x1 - x0 - 2 * half) * i) / 20; pts.push([x, -half, z(x)]) }
    range(10, (u) => pts.push([x0 + half - Math.cos(u * Math.PI / 2) * half, -Math.sin(u * Math.PI / 2) * half, z(x0)]))
    g.add(lines(pts))
  }
  return g
}

/** Grip rings / grooves as a lathe profile: `r(u)` the radius, `grooves` the u-ranges cut in. */
function gripProfile(len, r, grooves = [], depth = 0.12) {
  const pts = [[0, 0.3]]
  const xs = new Set(range(80, (u) => u))
  for (const [a, b] of grooves) { xs.add(a); xs.add(a + 0.006); xs.add(b - 0.006); xs.add(b) }
  for (const u of [...xs].sort((a, b) => a - b)) {
    const cut = grooves.some(([a, b]) => u > a + 0.003 && u < b - 0.003) ? depth : 0
    pts.push([u * len, r(u) - cut])
  }
  pts.push([len, 0.3])
  return pts
}

/* Binocular NVG, PVS-31 style: two monocular pods on articulating arms

function binoNVG() {
  const parts = []

    const g = new THREE.Group()

    g.add(solid(latheX([[-3.2, 0.5], [-3.2, 1.05], [-2.6, 1.15], [-1.2, 1.25], [1.6, 1.25], [2.0, 1.32], [2.6, 1.32], [2.6, 0.5]], 48), 26))

const MODEL_LIST = [

const CYCLE3 = 22000

  const idx = m3 >= 0 ? m3 : Math.floor(t / CYCLE3) % MODELS3D.length
  const model = MODELS3D[idx]
  if (model.credit) credit = model.credit
  if (model.loading) { if (shown !== model) { rig.clear(); shown = model } gl.renderer.render(gl.scene, gl.camera); ctx.fillStyle = A(0.6); ctx.font = `12px ${MONO}`; ctx.fillText(model.loading === true ? 'LOADING MODEL…' : `MODEL ${model.loading.toUpperCase()}`, 60, 140); return 'LOADING' }
  if (shown !== model) {

    shown = model

  const local = t % CYCLE3
  const appear = ease(local / 1800) * (1 - (m3 < 0 ? ease((local - CYCLE3 + 1200) / 1200) : 0))
  const explode = ease((local - 3200) / 3200) * (1 - ease((local - 15500) / 3200))

  // Slow turn, a slight tilt that breathes.
  if (model.upright) rig.rotation.set(0.62 + Math.sin(t * 0.00011) * 0.05, -0.6 + t * 0.00009, 0)
  else rig.rotation.set(0.32 + Math.sin(t * 0.00011) * 0.06, -0.55 + t * 0.00009, 0.04)
  for (const p of model.parts) {
    p.obj.position.set(p.home.x + p.e[0] * explode, p.home.y + p.e[1] * explode, p.home.z + p.e[2] * explode)

  cam.position.set(0, 0, dist * 0.92); cam.lookAt(0, 0, 0)

  gl.renderer.render(gl.scene, cam)

    // sheet: anchors left of centre go left, the rest right; each column is
    // sorted by height and spaced so no two labels touch.

      const q = new THREE.Vector3(x, y, z).project(cam), sx = (q.x * 0.5 + 0.5) * W

      if (p.nolabel) return

    })
    const mid = (minX + maxX) / 2
    for (const right of [false, true]) {

  ctx.font = `10.5px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = A(0.7 * appear)
  ctx.fillText(model.name, bx + 10, by + 12)
  ctx.fillStyle = A(0.45 * appear)
  ctx.fillText(`DWG ${model.code}`, bx + 10, by + 36); ctx.fillText('EXPLODED ISOMETRIC', bx + 10, by + 52)

/* =========================================================
   CITY TOPOGRAPHY: real streets, rivers and buildings
   (OpenStreetMap) over real contours (Terrain Tiles), from
   scripts/city-data.py. Drawn once to an offscreen layer;
   each frame only pans and zooms it, so a city of 50,000
   buildings costs one drawImage.

const CITY_IDS = ['medellin']

let cityPick = -1 // -1 cycles
const CITY_CYCLE = 45000
const cityCache = {}

function niceStep(span) {
  const raw = span / 22, p = Math.pow(10, Math.floor(Math.log10(raw)))
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p

}

  const bin = atob(e.data), out = new Float32Array(e.w * e.h)
  for (let i = 0; i < out.length; i++) {
    let v = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8)
    if (v & 0x8000) v -= 0x10000
    out[i] = Math.max(0, v) // the sea, and the odd bad sounding below it, are water
  }
  return out
}
function prepareCity(id) {
  if (cityCache[id]) return cityCache[id]
  const d = window.CITY_DATA && window.CITY_DATA[id]
  if (!d) return null
  const [mw, mh] = d.size, LW = 2600, k = LW / mw, LH = Math.round(mh * k)
  const layer = document.createElement('canvas'); layer.width = LW; layer.height = LH
  const c = layer.getContext('2d')
  const gw = d.elev.w, gh = d.elev.h
  // The elevation is a surface model, so a flat city reads its rooftops as
  // hills. A box blur takes that noise out; flatter cities get more of it.
  let elev = decodeElev(d.elev)
  const relief = d.elev.max - Math.max(0, d.elev.min)
  for (let pass = 0; pass < (relief < 120 ? 6 : 2); pass++) {
    const out = new Float32Array(elev.length)
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
      let sum = 0, n = 0
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const jj = j + dj, ii = i + di
        if (jj >= 0 && jj < gh && ii >= 0 && ii < gw) { sum += elev[jj * gw + ii]; n++ }
      }
      // Water stays water: a blur must not smear the coast inland.
      out[j * gw + i] = elev[j * gw + i] <= 0.5 ? 0 : sum / n

  }
  let lo = Infinity, hi = -Infinity
  for (const v of elev) { if (v > 0.5) { lo = Math.min(lo, v); hi = Math.max(hi, v) } }
  const step = niceStep(hi - lo) * (hi - lo < 120 ? 2 : 1)
  // Water: every grid cell at sea level, a faint wash with a fine hatch.
  const cw = LW / gw, ch = LH / gh
  c.fillStyle = A(0.035)
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) if (elev[j * gw + i] <= 0.5) c.fillRect(i * cw, j * ch, cw + 0.5, ch + 0.5)

      const a = elev[j * gw + i], b = elev[j * gw + i + 1], cc = elev[(j + 1) * gw + i + 1], dd = elev[(j + 1) * gw + i]
      const m = (a > level ? 8 : 0) | (b > level ? 4 : 0) | (cc > level ? 2 : 0) | (dd > level ? 1 : 0)

      const x = (i + 0.5) * cw, y = (j + 0.5) * ch
      const top = [x + cw * ((level - a) / (b - a)), y], right = [x + cw, y + ch * ((level - b) / (cc - b))]

        case 4: case 11: seg(top, right); break
        case 5: seg(left, top); seg(bottom, right); break
        case 6: case 9: seg(top, bottom); break

  c.beginPath()
  for (const r of d.rivers) { c.moveTo(r[0] * k, r[1] * k); for (let i = 2; i < r.length; i += 2) c.lineTo(r[i] * k, r[i + 1] * k) }
  c.stroke()
  c.font = `13px ${MONO}`; c.textAlign = 'center'; c.textBaseline = 'middle'
  for (const [x, y, e] of tags) { c.fillStyle = rgba(BG, 0.92); c.fillRect(x - 20, y - 8, 40, 16); c.fillStyle = A(0.5); c.fillText(`${e}`, x, y) }
  // A patrol route over the main roads: their vertices, a few, in a loop.
  const r = seeded(id.length * 7 + 1), main = []
  for (const rd of d.roads) if (rd[0] <= 3) for (let i = 1; i < rd.length; i += 2) main.push([rd[i], rd[i + 1]])
  const inner = main.filter(([x, y]) => x > mw * 0.15 && x < mw * 0.85 && y > mh * 0.18 && y < mh * 0.82)
  const route = []
  for (let i = 0; i < 7 && inner.length; i++) route.push(inner[Math.floor(r() * inner.length)])
  // Order them by angle round their centre, so the loop does not cross itself.
  const mx = route.reduce((s, p) => s + p[0], 0) / route.length, my = route.reduce((s, p) => s + p[1], 0) / route.length

}

function city(t) {

  const cc = prepareCity(id)
  if (!cc) { ctx.fillStyle = A(0.7); ctx.font = `13px ${MONO}`; ctx.fillText(`no data for ${id} (run scripts/city-data.py)`, 60, 120); return 'NO DATA' }
  const { d, layer, k } = cc
  const local = cityPick >= 0 ? t : t % CITY_CYCLE
  const fade = cityPick >= 0 ? clamp01(local / 1500) : clamp01(local / 1500) * (1 - clamp01((local - CITY_CYCLE + 1500) / 1500))
  // Slow drift and breathe, never past the edge of the map.

  ctx.strokeStyle = A(0.5 * (1 - ring)); ctx.beginPath(); ctx.arc(mx, my, 6 + ring * 46, 0, Math.PI * 2); ctx.stroke()
  ctx.strokeStyle = A(0.85); ctx.beginPath()
  ctx.moveTo(mx - 14, my); ctx.lineTo(mx - 4, my); ctx.moveTo(mx + 4, my); ctx.lineTo(mx + 14, my)
  ctx.moveTo(mx, my - 14); ctx.lineTo(mx, my - 4); ctx.moveTo(mx, my + 4); ctx.lineTo(mx, my + 14); ctx.stroke()
  const [lat0, lon0] = d.centre, [mw, mh] = d.size
  const lat = lat0 + (mh / 2 - wy) / 110540, lon = lon0 + (wx - mw / 2) / (111320 * Math.cos((lat0 * Math.PI) / 180))
  const fmt = (v, pos, neg) => `${Math.abs(v).toFixed(4)}°${v >= 0 ? pos : neg}`
  ctx.font = `10.5px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = A(0.8)
  ctx.fillText(`${fmt(lat, 'N', 'S')}  ${fmt(lon, 'E', 'W')}`, mx + 20, my - 8)
  ctx.fillStyle = A(0.5); ctx.fillText(`ELEV ${Math.round(cc.elevAt(wx, wy))}M · WP ${pad(i0 + 1)}/${pad(route.length)}`, mx + 20, my + 8)
  // City name, large and quiet, top left under the HUD.
  ctx.font = `600 22px ${MONO}`; ctx.fillStyle = A(0.55); ctx.textBaseline = 'top'
  ctx.fillText(d.name, 36, 70)
  ctx.font = `10.5px ${MONO}`; ctx.fillStyle = A(0.4)
  ctx.fillText(`${fmt(lat0, 'N', 'S')}  ${fmt(lon0, 'E', 'W')}  ·  ${(mw / 1000).toFixed(1)} × ${(mh / 1000).toFixed(1)} KM`, 36, 100)

}

/* =========================================================
   NEURAL, organic: cortex (calm hemispheres) and ultron (a core).
   Each node has a depth: far ones are smaller, dimmer, slower.
   ========================================================= */
function makeMesh(kind) {
  const r = seeded(kind === 'ultron' ? 5 : 3)
  const nodes = []
  const n = kind === 'ultron' ? 150 : 170
  for (let i = 0; i < n; i++) {
    let x, y
    if (kind === 'ultron') {
      const a = r() * Math.PI * 2, d = Math.pow(r(), 0.7)
      x = Math.cos(a) * d * 0.34; y = Math.sin(a) * d * 0.4
    } else {
      const side = r() < 0.5 ? -1 : 1
      const a = r() * Math.PI * 2, d = Math.sqrt(r())
      x = side * 0.12 + Math.cos(a) * d * 0.15; y = Math.sin(a) * d * 0.27
      if (Math.abs(x) < 0.012) x += side * 0.02
    }
    const z = 0.45 + r() * 0.55
    nodes.push({ hx: x, hy: y, z, x: 0, y: 0, ph: r() * 10, glow: 0, size: (1.2 + r() * 2.2) * z, tend: Array.from({ length: 2 + Math.floor(r() * 3) }, () => ({ a: r() * Math.PI * 2, l: (8 + r() * 22) * z })) })
  }
  return { kind, nodes, signals: [], lastSpawn: 0, lastSurge: 0, surge: -1 }
}
const meshes = { cortex: makeMesh('cortex'), ultron: makeMesh('ultron') }
function neural(t, mesh) {
  const ultron = mesh.kind === 'ultron'
  const N = mesh.nodes
  const R = Math.min(W, H) * (ultron ? 0.105 : 0.085)
  const cx = focusX(), cy = focusY()
  const slow = t * 0.00004
  for (const p of N) {
    const flow = (ultron ? 10 : 16) * p.z
    // Depth parallax: the whole mesh sways a little, near nodes more than far.
    const sway = Math.sin(t * 0.00012) * 14 * (p.z - 0.7)
    p.x = cx + p.hx * W + noise(p.hx * 3 + slow, p.ph) * flow + sway
    p.y = cy + p.hy * H + noise(p.ph, p.hy * 3 + slow) * flow
    p.glow *= ultron ? 0.95 : 0.965
  }
  const edges = []
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const dx = N[i].x - N[j].x, dy = N[i].y - N[j].y, d = Math.hypot(dx, dy)
    if (d < R) edges.push([i, j, d])
  }
  const adj = N.map(() => [])
  edges.forEach(([i, j]) => { adj[i].push(j); adj[j].push(i) })

  if (ultron) {
    if (t - mesh.lastSurge > 12000) { mesh.lastSurge = t; mesh.surge = t }
    const age = (t - mesh.surge) / 2600
    if (age >= 0 && age < 1) {
      const radius = age * Math.max(W, H) * 0.45
      for (const p of N) if (Math.abs(Math.hypot(p.x - cx, p.y - cy) - radius) < 18) p.glow = Math.max(p.glow, 0.9)
      ctx.strokeStyle = A(0.09 * (1 - age)); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.stroke()
    }
  }
  if (t - mesh.lastSpawn > (ultron ? 230 : 240)) {
    mesh.lastSpawn = t
    const from = Math.floor(Math.random() * N.length)
    if (adj[from].length) mesh.signals.push({ from, to: adj[from][Math.floor(Math.random() * adj[from].length)], k: 0, sp: ultron ? 0.018 : 0.014, life: ultron ? 5 : 9 })
  }
  const curve = (a, b, i) => {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y
    const bow = (ultron ? 0.08 : 0.22) * noise(i * 0.37, t * 0.00018)
    return [mx - dy * bow, my + dx * bow]
  }
  ctx.lineWidth = 1
  edges.forEach(([i, j, d], k) => {
    const a = N[i], b = N[j], g = Math.max(a.glow, b.glow), depth = Math.min(a.z, b.z)
    let alpha = ((1 - d / R) * (ultron ? 0.14 : 0.12) + g * 0.3) * depth
    if (ultron && Math.random() < 0.0003) alpha = 0.32
    ctx.strokeStyle = A(alpha)
    const [qx, qy] = curve(a, b, k)
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(qx, qy, b.x, b.y); ctx.stroke()
  })
  if (ultron) {
    N.forEach((p, i) => {
      const d = Math.hypot(p.x - cx, p.y - cy)
      if (d > Math.min(W, H) * 0.2 || i % 5) return
      ctx.strokeStyle = A((0.05 + p.glow * 0.25) * p.z)
      ctx.beginPath(); ctx.moveTo(cx, cy)
      ctx.quadraticCurveTo(cx + (p.x - cx) * 0.5 + noise(i, t * 0.0003) * 30, cy + (p.y - cy) * 0.5 + noise(t * 0.0003, i) * 30, p.x, p.y); ctx.stroke()
    })
  }
  for (let s = mesh.signals.length - 1; s >= 0; s--) {
    const sg = mesh.signals[s]
    sg.k += sg.sp
    const a = N[sg.from], b = N[sg.to]
    if (sg.k >= 1) {
      mesh.signals.splice(s, 1); b.glow = 1
      const next = adj[sg.to].filter((x) => x !== sg.from)
      if (next.length && sg.life > 0) mesh.signals.push({ from: sg.to, to: next[Math.floor(Math.random() * next.length)], k: 0, sp: sg.sp, life: sg.life - 1 })
      continue
    }
    const [qx, qy] = curve(a, b, 0)
    const u = sg.k, x = (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * qx + u * u * b.x, y = (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * qy + u * u * b.y
    const halo = ctx.createRadialGradient(x, y, 0, x, y, 10)
    halo.addColorStop(0, A(0.7 * Math.min(a.z, b.z))); halo.addColorStop(1, A(0))
    ctx.fillStyle = halo; ctx.fillRect(x - 10, y - 10, 20, 20)
  }
  for (const p of N) {
    ctx.strokeStyle = A((0.08 + p.glow * 0.3) * p.z)
    ctx.beginPath()
    for (const td of p.tend) {
      const a = td.a + noise(p.ph, t * 0.00025 + td.a) * 0.8
      const ex = p.x + Math.cos(a) * td.l, ey = p.y + Math.sin(a) * td.l
      ctx.moveTo(p.x, p.y); ctx.quadraticCurveTo(p.x + Math.cos(a + 0.6) * td.l * 0.5, p.y + Math.sin(a + 0.6) * td.l * 0.5, ex, ey)
    }
    ctx.stroke()
    if (p.glow > 0.05) {
      const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16 * p.z)
      halo.addColorStop(0, A(0.4 * p.glow * p.z)); halo.addColorStop(1, A(0))
      ctx.fillStyle = halo; ctx.fillRect(p.x - 16, p.y - 16, 32, 32)
    }
    ctx.fillStyle = A((0.45 + p.glow * 0.55) * p.z)
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (ultron ? 0.9 : 1), 0, Math.PI * 2); ctx.fill()
  }
  if (ultron) {
    const beat = 0.5 + 0.5 * Math.sin(t * 0.0016)
    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 70)
    core.addColorStop(0, A(0.35 + beat * 0.2)); core.addColorStop(0.25, A(0.18)); core.addColorStop(1, A(0))
    ctx.fillStyle = core; ctx.fillRect(cx - 70, cy - 70, 140, 140)
    ctx.strokeStyle = A(0.6); ctx.lineWidth = 1.2
    for (const [rr, sp] of [[22, 0.0007], [34, -0.00045], [48, 0.0002]]) {
      ctx.beginPath(); ctx.arc(cx, cy, rr, t * sp, t * sp + Math.PI * 1.4); ctx.stroke()
    }
  }
  return `${ultron ? 'CORE ONLINE' : 'CORTEX'} · NODES ${N.length} · SYNAPSES ${edges.length} · SIGNALS ${pad(mesh.signals.length)}`
}

/* =========================================================

   ========================================================= */
const TEXT = (size, a, weight = 400) => { ctx.font = `${weight} ${size}px ${MONO}`; ctx.fillStyle = A(a) }

/* ---------- 1. NVG sweep: the city through binocular goggles ---------- */
function nvg(t) {
  const cc = cityLayer('medellin')
  if (!cc) return 'NO DATA'
  const { layer } = cc
  const s = Math.max(W / layer.width, H / layer.height) * 1.15
  const ox = (W - layer.width * s) / 2, oy = (H - layer.height * s) / 2
  ctx.globalAlpha = 0.16; ctx.drawImage(layer, ox, oy, layer.width * s, layer.height * s); ctx.globalAlpha = 1

  const cx = W * 0.5 + Math.sin(t * 0.00009) * W * 0.22, cy = H * 0.46 + Math.sin(t * 0.00018) * H * 0.14
  const r = Math.min(W, H) * 0.27, gap = r * 0.62
  const lens = () => { ctx.beginPath(); ctx.moveTo(cx - gap + r, cy); ctx.arc(cx - gap, cy, r, 0, Math.PI * 2); ctx.moveTo(cx + gap + r, cy); ctx.arc(cx + gap, cy, r, 0, Math.PI * 2) }
  ctx.save(); lens(); ctx.clip()
  ctx.fillStyle = 'rgba(8, 22, 12, 0.92)'; ctx.fillRect(0, 0, W, H)
  // Magnified: 1.6x about the lens centre.
  const m = 1.6
  ctx.globalAlpha = 0.95
  ctx.drawImage(layer, cx - (cx - ox) * m, cy - (cy - oy) * m, layer.width * s * m, layer.height * s * m)
  ctx.globalAlpha = 1
  // Phosphor glow, scanlines, and grain.
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6)
  glow.addColorStop(0, 'rgba(105,180,138,0.10)'); glow.addColorStop(1, 'rgba(0,0,0,0.55)')
  ctx.fillStyle = glow; ctx.fillRect(cx - gap - r, cy - r, gap * 2 + r * 2, r * 2)
  ctx.fillStyle = 'rgba(0,0,0,0.22)'
  for (let y = Math.floor(cy - r) + ((t / 40) % 3); y < cy + r; y += 3) ctx.fillRect(cx - gap - r, y, gap * 2 + r * 2, 1)
  const rg = seeded(Math.floor(t / 60))
  ctx.fillStyle = A(0.18)
  for (let i = 0; i < 260; i++) ctx.fillRect(cx - gap - r + rg() * (gap * 2 + r * 2), cy - r + rg() * r * 2, 1, 1)
  ctx.restore()
  // Lens rims and a reticle.
  ctx.strokeStyle = A(0.6); ctx.lineWidth = 2; lens(); ctx.stroke(); ctx.lineWidth = 1
  ctx.strokeStyle = A(0.45); ctx.beginPath()
  seg(cx - 26, cy, cx - 8, cy); seg(cx + 8, cy, cx + 26, cy); seg(cx, cy - 26, cx, cy - 8); seg(cx, cy + 8, cx, cy + 26)
  for (let i = -4; i <= 4; i++) if (i) seg(cx + i * 18, cy + 40, cx + i * 18, cy + (i % 2 ? 44 : 48))
  ctx.stroke()
  // Readouts inside the lower rim.
  const [lat0, lon0] = cc.d.centre, [mw, mh] = cc.d.size
  const wx = (cx - ox) / (cc.k * s), wy = (cy - oy) / (cc.k * s)
  const lat = lat0 + (mh / 2 - wy) / 110540, lon = lon0 + (wx - mw / 2) / (111320 * Math.cos((lat0 * Math.PI) / 180))
  TEXT(10.5, 0.75); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText(`${Math.abs(lat).toFixed(4)}°N  ${Math.abs(lon).toFixed(4)}°W`, cx, cy + r * 0.62)
  TEXT(9.5, 0.5); ctx.fillText(`GAIN ${(3.8 + Math.sin(t * 0.0007) * 0.4).toFixed(1)} · IR ${Math.floor(t / 4000) % 2 ? 'ON' : 'OFF'} · ×${m.toFixed(1)}`, cx, cy + r * 0.62 + 16)
  return `NVG · PHOSPHOR WHITE-GREEN · MEDELLÍN · ELEV ${Math.round(cc.elevAt(Math.max(0, Math.min(mw, wx)), Math.max(0, Math.min(mh, wy))))}M`
}

/* ---------- 3. OPSAT: the wrist computer's mission screen ---------- */
const OPSAT = (() => {
  const r = seeded(41)
  const rooms = []
  // A floor plan on a 12 x 8 grid: a corridor and rooms off it.
  const cells = [[0, 0, 4, 3], [4, 0, 3, 3], [7, 0, 5, 3], [0, 3, 12, 2], [0, 5, 3, 3], [3, 5, 4, 3], [7, 5, 2, 3], [9, 5, 3, 3]]
  for (const [x, y, w, h] of cells) rooms.push({ x, y, w, h })
  const route = [[0.5, 4], [3.5, 4], [5.5, 4], [5.5, 1.5], [9.5, 1.5], [9.5, 4], [10.5, 6.5]]
  const guards = [{ path: [[1, 6.5], [2.4, 6.5]], sp: 0.00025 }, { path: [[8, 3.6], [11.4, 3.6]], sp: 0.00018 }, { path: [[4.6, 6.8], [6.4, 6.0]], sp: 0.0003 }]
  const intel = ['VAULT SEALED // AUTH REQUIRED', 'NODE 07 HANDSHAKE OK', 'SAT UPLINK 98%', 'NO HOSTILE SIGNALS', 'THERMAL: 3 CONTACTS', 'PERIMETER NOMINAL', 'LAST ACCESS 00:14 AGO', 'CIPHER AES-256-GCM', 'BACKUP ROTATION 10/10', 'MIRROR OFFLINE', 'SESSION PURGED', 'IDLE WATCH ARMED']
  return { rooms, route, guards, intel, r }
})()
function opsat(t) {
  grid(24, 0.025)
  const pw = Math.min(W * 0.86, 1500), ph = Math.min(H * 0.66, 620), px = (W - pw) / 2, py = H * 0.12
  ctx.strokeStyle = A(0.45); ctx.strokeRect(px + 0.5, py + 0.5, pw, ph)
  ctx.beginPath(); seg(px, py + 34.5, px + pw, py + 34.5); ctx.stroke()
  TEXT(12, 0.85, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'
  ctx.fillText('OPSAT  //  OPERATION SEALED VAULT', px + 14, py + 17)
  TEXT(10.5, 0.5); ctx.textAlign = 'right'
  ctx.fillText(`FREQ 4.${pad(Math.floor(t / 1000) % 60)} GHZ · ENCRYPTED`, px + pw - 14, py + 17)
  // Columns: objectives | map | intel.
  const c1 = px + pw * 0.26, c2 = px + pw * 0.74
  ctx.beginPath(); seg(c1 + 0.5, py + 34, c1 + 0.5, py + ph); seg(c2 + 0.5, py + 34, c2 + 0.5, py + ph); ctx.stroke()
  // Objectives tick off one by one, then reset.
  const objectives = ['INFILTRATE PERIMETER', 'BYPASS CAMERA NET', 'ACCESS SERVER ROOM', 'EXTRACT ARCHIVE', 'SEAL THE VAULT']
  const done = Math.floor((t % 30000) / 5000)
  TEXT(10.5, 0.5); ctx.textAlign = 'left'; ctx.fillText('PRIMARY OBJECTIVES', px + 14, py + 56)
  objectives.forEach((o, i) => {
    const y = py + 86 + i * 30, ok = i < done
    ctx.strokeStyle = A(ok ? 0.8 : 0.4); ctx.strokeRect(px + 14.5, y - 6.5, 12, 12)
    if (ok) { ctx.beginPath(); seg(px + 17, y, px + 20, y + 3); seg(px + 20, y + 3, px + 25, y - 4); ctx.stroke() }
    TEXT(11, ok ? 0.45 : 0.85); ctx.fillText(o, px + 36, y)
    if (ok) { ctx.strokeStyle = A(0.35); ctx.beginPath(); seg(px + 36, y, px + 36 + ctx.measureText(o).width, y); ctx.stroke() }
  })
  TEXT(10.5, 0.5); ctx.fillText(`STATUS  ${done >= 5 ? 'COMPLETE' : 'IN PROGRESS'}`, px + 14, py + ph - 24)
  // Map: rooms, the route, the operative, guards with vision cones.
  const mx0 = c1 + 24, my0 = py + 58, mw = c2 - c1 - 48, mh = ph - 82, u = Math.min(mw / 12, mh / 8)
  const ox = mx0 + (mw - u * 12) / 2, oy = my0 + (mh - u * 8) / 2
  const P = ([x, y]) => [ox + x * u, oy + y * u]
  ctx.save(); ctx.beginPath(); ctx.rect(ox - 2, oy - 2, u * 12 + 4, u * 8 + 4); ctx.clip()
  ctx.strokeStyle = A(0.35)
  for (const rm of OPSAT.rooms) ctx.strokeRect(ox + rm.x * u + 0.5, oy + rm.y * u + 0.5, rm.w * u, rm.h * u)
  ctx.fillStyle = rgba(BG, 1)
  for (const [x, y, vertical] of [[2, 3, 0], [5.5, 3, 0], [10, 3, 0], [1.5, 5, 0], [5, 5, 0], [8, 5, 0], [10.5, 5, 0], [4, 1.5, 1], [7, 1.5, 1]])
    vertical ? ctx.fillRect(ox + x * u - 2, oy + y * u - u * 0.3, 4, u * 0.6) : ctx.fillRect(ox + x * u - u * 0.3, oy + y * u - 2, u * 0.6, 4)
  const k = ((t % 30000) / 30000) * (OPSAT.route.length - 1), i0 = Math.floor(k), f = k - i0
  ctx.setLineDash([3, 5]); ctx.strokeStyle = A(0.45); ctx.beginPath()
  OPSAT.route.forEach((p, i) => { const [x, y] = P(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y) }); ctx.stroke(); ctx.setLineDash([])
  const a = P(OPSAT.route[i0]), b = P(OPSAT.route[Math.min(i0 + 1, OPSAT.route.length - 1)])
  const sx = lerp(a[0], b[0], f), sy = lerp(a[1], b[1], f)
  ctx.fillStyle = A(0.95); ctx.beginPath(); ctx.arc(sx, sy, 4, 0, Math.PI * 2); ctx.fill()
  ctx.strokeStyle = A(0.5); ctx.beginPath(); ctx.arc(sx, sy, 9 + ((t / 90) % 10), 0, Math.PI * 2); ctx.stroke()
  for (const g of OPSAT.guards) {
    const q = (Math.sin(t * g.sp * 6.283) + 1) / 2, [p1, p2] = g.path.map(P)
    const gx = lerp(p1[0], p2[0], q), gy = lerp(p1[1], p2[1], q)
    const dir = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]) + (Math.cos(t * g.sp * 6.283) > 0 ? 0 : Math.PI)
    const cone = ctx.createRadialGradient(gx, gy, 0, gx, gy, u * 2)
    cone.addColorStop(0, A(0.22)); cone.addColorStop(1, A(0))
    ctx.fillStyle = cone; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.arc(gx, gy, u * 2, dir - 0.5, dir + 0.5); ctx.closePath(); ctx.fill()
    ctx.strokeStyle = A(0.75); ctx.beginPath(); seg(gx - 4, gy - 4, gx + 4, gy + 4); seg(gx + 4, gy - 4, gx - 4, gy + 4); ctx.stroke()
  }
  ctx.restore()
  TEXT(9.5, 0.45); ctx.textAlign = 'left'; ctx.fillText('LVL 2 · EAST WING', ox, oy - 12)
  // Intel feed scrolls up, newest at the bottom.
  TEXT(10.5, 0.5); ctx.fillText('INTEL FEED', c2 + 14, py + 56)
  const lines_ = 12, step = 2600, n = Math.floor(t / step), frac = (t % step) / step

    const idx = n + i, y = py + 86 + i * 22 - frac * 22
    const age = (lines_ - 1 - i) / lines_
    TEXT(10.5, 0.25 + 0.6 * (1 - age))
    const time = new Date(Date.now() - (lines_ - 1 - i) * step)
    ctx.fillText(`${pad(time.getHours())}:${pad(time.getMinutes())}:${pad(time.getSeconds())}  ${OPSAT.intel[idx % OPSAT.intel.length]}`, c2 + 14, y)
  }
  ctx.restore()
  return `OPSAT V4.2 · LINK SECURE · OBJECTIVES ${Math.min(done, 5)}/5`
}

/* ---------- 4. Infiltration cutaway: a building in section ---------- */
const BLD = (() => {
  const floors = 7, rooms = []

})()
function cutaway(t) {
  grid(24, 0.025)
  const fh = Math.min((H * 0.62) / BLD.floors, 64), u = Math.min((W * 0.5) / 10, fh * 1.4)
  const bw = u * 10, ox = (W - bw) / 2 - u * 0.4, base = H * 0.8
  const P = ([x, y]) => [ox + x * u, base - y * fh]
  ctx.lineWidth = 1
  // Ground line with hatching below.
  ctx.strokeStyle = A(0.5); ctx.beginPath(); seg(0, base + 0.5, W, base + 0.5); ctx.stroke()
  ctx.strokeStyle = A(0.1); ctx.beginPath()
  for (let x = -40; x < W; x += 14) seg(x, base + 40, x + 30, base + 2); ctx.stroke()
  // Rooms, floor slabs, windows.
  for (const rm of BLD.rooms) {
    const [x, y] = P([rm.x, rm.f + 1])
    ctx.strokeStyle = A(0.3); ctx.strokeRect(x + 0.5, y + 0.5, rm.w * u, fh)
    if (rm.lit) { ctx.fillStyle = A(0.04 + 0.03 * Math.sin(t * 0.001 + rm.x)); ctx.fillRect(x + 1, y + 1, rm.w * u - 1, fh - 1) }
  }
  ctx.strokeStyle = A(0.6); ctx.strokeRect(ox + 0.5, base - BLD.floors * fh + 0.5, bw, BLD.floors * fh)
  // Stairwell, ducts, the pipe.
  ctx.strokeStyle = A(0.2); ctx.beginPath()
  for (let f = 0; f < BLD.floors; f++) { const [x0, y0] = P([0.4, f]); seg(x0, y0, x0 + u * 1.2, y0 - fh) }
  ctx.stroke()
  ctx.setLineDash([6, 4]); ctx.strokeStyle = A(0.35); ctx.beginPath()
  const [d1x, d1y] = P([9.4, 4.85]), [d2x] = P([4.0, 4.85])
  seg(d2x, d1y - 5, d1x, d1y - 5); seg(d2x, d1y + 5, d1x, d1y + 5); ctx.stroke(); ctx.setLineDash([])
  const [px1, py1] = P([10.6, 0]), [, py2] = P([10.6, BLD.floors])
  ctx.strokeStyle = A(0.45); ctx.beginPath(); seg(px1 + 0.5, py1, px1 + 0.5, py2); ctx.stroke()
  for (let y = py2; y < py1; y += fh / 2) { ctx.beginPath(); seg(px1 - 4, y, px1 + 5, y); ctx.stroke() }
  // The route draws itself, the operative follows, waypoints label as reached.
  const cycle = 36000, prog = (t % cycle) / cycle * (BLD.route.length - 1)
  ctx.strokeStyle = A(0.8); ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]); ctx.beginPath()
  const [s0x, s0y] = P(BLD.route[0]); ctx.moveTo(s0x, s0y)
  for (let i = 1; i <= Math.ceil(prog) && i < BLD.route.length; i++) {
    const a = P(BLD.route[i - 1]), b = P(BLD.route[i]), f = Math.min(1, prog - (i - 1))
    ctx.lineTo(lerp(a[0], b[0], f), lerp(a[1], b[1], f))
  }
  ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1
  const i0 = Math.min(BLD.route.length - 2, Math.floor(prog)), f = prog - i0
  const a = P(BLD.route[i0]), b = P(BLD.route[i0 + 1])
  const ax = lerp(a[0], b[0], f), ay = lerp(a[1], b[1], f)
  ctx.fillStyle = A(1); ctx.beginPath(); ctx.arc(ax, ay, 4, 0, Math.PI * 2); ctx.fill()
  ctx.strokeStyle = A(0.4); ctx.beginPath(); ctx.arc(ax, ay, 10 + ((t / 80) % 8), 0, Math.PI * 2); ctx.stroke()
  BLD.tags.forEach(([ri, label], k) => {
    if (prog < ri - 0.05) return
    const [x, y] = P(BLD.route[ri]), right = x > ox + bw / 2
    const lx = right ? ox + bw + u * 1.6 : ox - u * 1.2
    ctx.strokeStyle = A(0.4); ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); seg(x, y, lx, y); ctx.stroke()
    TEXT(10.5, 0.8); ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'middle'
    ctx.fillText(`${pad(k + 1)}  ${label}`, lx + (right ? 6 : -6), y)
  })

  for (let f = 0; f < BLD.floors; f++) { const [, y] = P([0, f + 0.5]); ctx.fillText(`FL ${pad(f + 1)}`, ox - u * 0.9 + 0, y) }
  return `SECTION B-B · ${BLD.floors} FLOORS · WAYPOINT ${pad(Math.min(BLD.tags.length, BLD.tags.filter(([ri]) => prog >= ri).length))}/${pad(BLD.tags.length)}`
}

/* ---------- 8. Signal decryption ---------- */
const HEXCH = '0123456789ABCDEF'
function decrypt(t) {
  grid(24, 0.025)
  const cyc = 24000, k = (t % cyc) / cyc
  const lock = clamp01((k - 0.15) / 0.55)
  const cx = W / 2, top = H * 0.14, ww = Math.min(W * 0.7, 1100), x0 = cx - ww / 2
  // Oscilloscope: noise settles into a clean carrier as the lock comes in.
  ctx.strokeStyle = A(0.25); ctx.strokeRect(x0 + 0.5, top + 0.5, ww, 140)
  ctx.beginPath(); seg(x0, top + 70.5, x0 + ww, top + 70.5); ctx.strokeStyle = A(0.1); ctx.stroke()
  ctx.strokeStyle = A(0.85); ctx.lineWidth = 1.4; ctx.beginPath()
  for (let i = 0; i <= ww; i += 2) {
    const ph = i * 0.035 + t * 0.004
    const clean = Math.sin(ph) * 38 + Math.sin(ph * 3) * 8
    const dirty = (noise(i * 0.08, t * 0.002) * 2) * 55 + Math.sin(ph * 1.7) * 20
    const y = top + 70 + lerp(dirty, clean, lock)
    i ? ctx.lineTo(x0 + i, y) : ctx.moveTo(x0 + i, y)
  }
  ctx.stroke(); ctx.lineWidth = 1
  // Spectrum bars with a peak marker that walks onto the carrier.
  const by = top + 170, bh = 90, n = 64
  for (let i = 0; i < n; i++) {
    const peak = Math.exp(-Math.pow((i - lerp(10 + 40 * noise(t * 0.0005, 3) + 20, 38, lock)) / 3, 2))
    const v = clamp01(0.15 + Math.abs(noise(i * 0.4, t * 0.003)) * 0.6 * (1 - lock * 0.7) + peak * (0.3 + lock * 0.7))
    ctx.fillStyle = A(0.15 + v * 0.6)
    ctx.fillRect(x0 + i * (ww / n) + 1, by + bh - v * bh, ww / n - 3, v * bh)
  }
  TEXT(9.5, 0.45); ctx.textAlign = 'left'; ctx.textBaseline = 'top'
  ctx.fillText('2.400', x0, by + bh + 6); ctx.textAlign = 'right'; ctx.fillText('2.483 GHZ', x0 + ww, by + bh + 6)
  // Tuning dial.
  const dx = x0 + ww + 90, dy = top + 70
  if (dx + 70 < W - 30) {
    ctx.strokeStyle = A(0.4); ctx.beginPath(); ctx.arc(dx, dy, 56, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke()
    for (let i = 0; i <= 20; i++) { const a = Math.PI * 0.75 + (i / 20) * Math.PI * 1.5, l = i % 5 ? 5 : 10; ctx.beginPath(); seg(dx + Math.cos(a) * 56, dy + Math.sin(a) * 56, dx + Math.cos(a) * (56 - l), dy + Math.sin(a) * (56 - l)); ctx.stroke() }
    const na = Math.PI * 0.75 + (lerp(0.2 + 0.6 * (noise(t * 0.0006, 1) + 0.5), 0.62, lock)) * Math.PI * 1.5
    ctx.strokeStyle = A(0.9); ctx.beginPath(); seg(dx, dy, dx + Math.cos(na) * 48, dy + Math.sin(na) * 48); ctx.stroke()
    TEXT(9.5, 0.5); ctx.textAlign = 'center'; ctx.fillText('TUNE', dx, dy + 30)
  }
  // Hex dump: random bytes resolve, left to right, into the message.
  const msg = 'NEXUS // VAULT SEALED // AWAITING KEY'
  const rows = 6, cols = 16, hy = by + bh + 40, cw = ww / cols
  const rg = seeded(Math.floor(t / 90))
  TEXT(12, 0.6); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  const resolved = Math.floor(clamp01((k - 0.45) / 0.35) * msg.length)
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const idx = r * cols + c
    const v = idx < resolved ? msg.charCodeAt(idx) : Math.floor(rg() * 256)
    ctx.fillStyle = A(idx < resolved ? 0.95 : 0.3)
    ctx.fillText(HEXCH[v >> 4] + HEXCH[v & 15], x0 + c * cw + cw / 2, hy + r * 22)
  }
  // The decoded line.
  TEXT(16, 0.9, 600); ctx.textAlign = 'center'
  const shown = msg.slice(0, resolved) + (resolved < msg.length ? msg.slice(resolved).replace(/[^ ]/g, () => String.fromCharCode(33 + Math.floor(rg() * 60))) : '')
  ctx.fillText(shown, cx, hy + rows * 22 + 34)
  const pct = Math.round(lock * 100)
  return `SIGNAL ${pct >= 100 ? 'LOCKED' : 'ACQUIRING'} · ${pct}% · KEY ${resolved >= msg.length ? 'DECODED' : 'PENDING'}`
}

/* ---------- 7. City surveillance network ---------- */
const SURV = { picked: null }
function surveillance(t) {
  const cc = cityLayer('medellin')
  if (!cc) return 'NO DATA'
  const { layer, d, k } = cc
  const s = Math.max(W / layer.width, H / layer.height) * 1.05
  const ox = (W - layer.width * s) / 2, oy = (H - layer.height * s) / 2
  ctx.globalAlpha = 0.55; ctx.drawImage(layer, ox, oy, layer.width * s, layer.height * s); ctx.globalAlpha = 1
  const toS = ([x, y]) => [ox + x * k * s, oy + y * k * s]
  if (!SURV.picked) {
    // Cameras at major junction vertices; towers spread across the frame.
    const r = seeded(9), main = []
    for (const rd of d.roads) if (rd[0] <= 2) for (let i = 1; i < rd.length; i += 2) main.push([rd[i], rd[i + 1]])
    const onScreen = main.filter((p) => { const [x, y] = toS(p); return x > 80 && x < W - 80 && y > 120 && y < H - 140 })
    const cams = []
    for (let i = 0; i < 400 && cams.length < 14; i++) {
      const p = onScreen[Math.floor(r() * onScreen.length)]
      if (p && cams.every((c) => Math.hypot(c.p[0] - p[0], c.p[1] - p[1]) > 700)) cams.push({ p, dir: r() * Math.PI * 2, sp: 0.0002 + r() * 0.0003, fov: 0.5 + r() * 0.3 })
    }
    const towers = [[0.18, 0.25], [0.82, 0.3], [0.5, 0.82]].map(([fx, fy]) => [((fx * W - ox) / (k * s)), ((fy * H - oy) / (k * s))])
    SURV.picked = { cams, towers }
  }
  const { cams, towers } = SURV.picked
  for (const c of cams) {
    const [x, y] = toS(c.p), dir = c.dir + Math.sin(t * c.sp) * 0.9, R = 70
    const g = ctx.createRadialGradient(x, y, 0, x, y, R)
    g.addColorStop(0, A(0.28)); g.addColorStop(1, A(0))
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, R, dir - c.fov / 2, dir + c.fov / 2); ctx.closePath(); ctx.fill()
    ctx.strokeStyle = A(0.8); ctx.strokeRect(x - 3.5, y - 3.5, 7, 7)
  }
  // Target: a phone that triangulates. The estimate tightens, locks, moves on.
  const cyc = 14000, n = Math.floor(t / cyc), k2 = (t % cyc) / cyc
  const rt = seeded(500 + n)
  const tx = W * (0.25 + rt() * 0.5), ty = H * (0.25 + rt() * 0.45)
  towers.forEach((tw, i) => {
    const [x, y] = toS(tw)
    ctx.strokeStyle = A(0.7); ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x + 8, y + 6); ctx.lineTo(x - 8, y + 6); ctx.closePath(); ctx.stroke()
    for (let j = 0; j < 3; j++) { const rr = ((t / 25 + j * 60 + i * 40) % 180); ctx.strokeStyle = A(0.25 * (1 - rr / 180)); ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.stroke() }
    const reach = clamp01(k2 / 0.4)
    ctx.setLineDash([4, 5]); ctx.strokeStyle = A(0.5); ctx.beginPath(); seg(x, y, lerp(x, tx, reach), lerp(y, ty, reach)); ctx.stroke(); ctx.setLineDash([])
    TEXT(9.5, 0.5); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(`TWR ${String.fromCharCode(65 + i)}`, x, y + 10)
  })
  const err = lerp(120, 10, clamp01((k2 - 0.35) / 0.4))
  const locked = k2 > 0.75
  ctx.strokeStyle = A(locked ? 0.95 : 0.6); ctx.beginPath(); ctx.ellipse(tx, ty, err, err * 0.7, 0.4, 0, Math.PI * 2); ctx.stroke()
  if (locked) {
    ctx.beginPath(); seg(tx - 20, ty, tx - 6, ty); seg(tx + 6, ty, tx + 20, ty); seg(tx, ty - 20, tx, ty - 6); seg(tx, ty + 6, tx, ty + 20); ctx.stroke()
    TEXT(11, 0.95, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('TARGET LOCKED', tx + 28, ty - 8)
    TEXT(10, 0.6); ctx.fillText(`IMSI 732-101-${String(4000 + n * 37).slice(-4)} · ±${Math.round(err * 3)}M`, tx + 28, ty + 8)
  } else {
    TEXT(10, 0.6); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(`TRIANGULATING · ±${Math.round(err * 3)}M`, tx + err + 10, ty)
  }
  ctx.font = `600 22px ${MONO}`; ctx.fillStyle = A(0.55); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(d.name, 36, 70)
  credit = d.credit
  return `SURVEILLANCE GRID · ${cams.length} CAMERAS · 3 TOWERS · ${locked ? 'LOCK' : 'SCAN'}`
}

/* ---------- 5. Detective mode: an x-ray room with figures ---------- */
const DET = (() => {
  // A room, 10 x 3 x 7 m, with crates, a desk and four figures in poses.
  const boxes = [[-3.5, 0, -2, 1.2, 1.0, 1.0], [-3.5, 1.0, -2, 1.0, 0.8, 0.9], [2.5, 0, 1.5, 2.0, 0.8, 1.0], [3.8, 0, -2.6, 1.2, 1.2, 1.2], [-1, 0, 2.5, 2.4, 0.75, 0.8]]
  // Figure: [x, z, facing, pose, label] pose 0 stand armed, 1 patrol, 2 crouch, 3 seated
  const figs = [[-1.5, -1.2, 0.6, 0, 'ARMED · HOSTILE', 104], [2.2, -0.5, -2.4, 1, 'PATROLLING', 88], [-3.2, 1.6, 1.4, 2, 'UNAWARE', 72], [0.2, 2.1, 3.1, 3, 'UNCONSCIOUS', 48]]
  return { boxes, figs }
})()
function skeleton(pose, walk) {
  // Joints in metres, figure facing +Z at the origin.
  const sw = Math.sin(walk) * (pose === 1 ? 0.35 : 0)
  const crouch = pose === 2 ? 0.35 : 0, seated = pose === 3
  const hip = seated ? 0.5 : 0.95 - crouch, chest = hip + 0.5, neck = chest + 0.18, head = neck + 0.14
  const J = {
    head: [0, head, 0], neck: [0, neck, 0], chest: [0, chest, 0], hip: [0, hip, 0],
    ls: [-0.2, chest, 0], rs: [0.2, chest, 0], le: [-0.26, chest - 0.28, 0.05 + sw * 0.4], re: [0.26, chest - 0.28, 0.05 - sw * 0.4],
    lh: [-0.24, chest - 0.55, 0.12 + sw * 0.5], rh: [0.24, chest - 0.55, 0.12 - sw * 0.5],
    lp: [-0.11, hip, 0], rp: [0.11, hip, 0],
    lk: seated ? [-0.12, 0.5, 0.45] : [-0.12, hip * 0.5 + crouch * 0.1, 0.05 + crouch * 0.35 + sw * 0.3], rk: seated ? [0.12, 0.5, 0.45] : [0.12, hip * 0.5 + crouch * 0.1, 0.05 + crouch * 0.2 - sw * 0.3],
    lf: seated ? [-0.12, 0, 0.5] : [-0.12, 0, sw * 0.4 - crouch * 0.1], rf: seated ? [0.12, 0, 0.5] : [0.12, 0, -sw * 0.4]
  }
  if (pose === 0) { J.le = [-0.1, chest - 0.15, 0.3]; J.re = [0.18, chest - 0.15, 0.32]; J.lh = [0.0, chest - 0.08, 0.55]; J.rh = [0.08, chest - 0.12, 0.45] }
  const bones = [['head', 'neck'], ['neck', 'chest'], ['chest', 'hip'], ['ls', 'rs'], ['ls', 'le'], ['le', 'lh'], ['rs', 're'], ['re', 'rh'], ['lp', 'rp'], ['lp', 'lk'], ['lk', 'lf'], ['rp', 'rk'], ['rk', 'rf']]
  return { J, bones, weapon: pose === 0 ? [[0.0, chest - 0.1, 0.4], [0.05, chest - 0.02, 0.95]] : null }
}
function detective(t) {
  const yaw = t * 0.00006 + 0.6, pitch = 0.34, dist = 19
  const fx = focusX(), fy = focusY() + H * 0.04, f = Math.min(W, H) * 1.35
  const proj = ([x, y, z]) => {
    const cx = Math.cos(yaw), sx = Math.sin(yaw)
    let X = x * cx - z * sx, Z = x * sx + z * cx
    const cp = Math.cos(pitch), sp = Math.sin(pitch)
    let Y = (y - 1.2) * cp - Z * sp; Z = (y - 1.2) * sp + Z * cp
    Z += dist
    return [fx + (X / Z) * f, fy - (Y / Z) * f, Z]
  }
  const line3 = (a, b, alpha) => { const p = proj(a), q = proj(b); ctx.strokeStyle = A(alpha); ctx.beginPath(); seg(p[0], p[1], q[0], q[1]); ctx.stroke() }
  // Floor grid and walls.
  for (let i = -5; i <= 5; i++) { line3([i, 0, -3.5], [i, 0, 3.5], 0.1); }
  for (let j = -3.5; j <= 3.5; j += 1) line3([-5, 0, j], [5, 0, j], 0.1)
  const corners = [[-5, -3.5], [5, -3.5], [5, 3.5], [-5, 3.5]]
  corners.forEach(([x, z], i) => { const [nx, nz] = corners[(i + 1) % 4]; line3([x, 0, z], [nx, 0, nz], 0.35); line3([x, 3, z], [nx, 3, nz], 0.07); line3([x, 0, z], [x, 3, z], 0.12) })
  // Crates and desk as wire boxes.
  for (const [x, y, z, w, h, d] of DET.boxes) {
    const v = [[x, y, z], [x + w, y, z], [x + w, y, z + d], [x, y, z + d]]
    v.forEach((p, i) => { const q = v[(i + 1) % 4]; line3(p, q, 0.3); line3([p[0], y + h, p[2]], [q[0], y + h, q[2]], 0.3); line3(p, [p[0], y + h, p[2]], 0.3) })
  }
  // Scan plane sweeping the room.
  const sweep = ((t / 6000) % 1) * 10 - 5
  line3([sweep, 0, -3.5], [sweep, 3, -3.5], 0.5); line3([sweep, 3, -3.5], [sweep, 3, 3.5], 0.5); line3([sweep, 0, 3.5], [sweep, 3, 3.5], 0.5)
  // Figures: a glow behind the skeleton, brighter for the armed one.
  for (const [x, z, face, pose, label, bpm] of DET.figs) {
    const walkX = pose === 1 ? Math.sin(t * 0.0003) * 1.5 : 0
    const sk = skeleton(pose, t * 0.004)
    const cf = Math.cos(face), sf = Math.sin(face)
    const W3 = ([jx, jy, jz]) => [x + walkX + jx * cf + jz * sf, jy, z - jx * sf + jz * cf]
    const scanned = Math.abs(x + walkX - sweep) < 0.6
    const strong = pose === 0 ? 1 : 0.7
    const hp = proj(W3(sk.J.chest))
    const halo = ctx.createRadialGradient(hp[0], hp[1], 0, hp[0], hp[1], 90)
    halo.addColorStop(0, A((pose === 0 ? 0.22 : 0.12) + (scanned ? 0.15 : 0))); halo.addColorStop(1, A(0))
    ctx.fillStyle = halo; ctx.fillRect(hp[0] - 90, hp[1] - 90, 180, 180)
    ctx.lineWidth = 2
    for (const [a, b] of sk.bones) line3(W3(sk.J[a]), W3(sk.J[b]), (0.55 + (scanned ? 0.4 : 0)) * strong)
    const head = proj(W3(sk.J.head)), hr = 0.13 * f / head[2]
    ctx.strokeStyle = A(0.8 * strong); ctx.beginPath(); ctx.arc(head[0], head[1] - hr, hr, 0, Math.PI * 2); ctx.stroke()
    if (sk.weapon) line3(W3(sk.weapon[0]), W3(sk.weapon[1]), 1)
    ctx.lineWidth = 1
    // Heart, pulsing at its own rate.
    const hrt = proj(W3([0.07, sk.J.chest[1] - 0.05, 0.05])), beat = Math.pow(Math.max(0, Math.sin(t * (bpm / 60) * 0.006283)), 8)
    ctx.fillStyle = A(0.5 + beat * 0.5); ctx.beginPath(); ctx.arc(hrt[0], hrt[1], 2.5 + beat * 2.5, 0, Math.PI * 2); ctx.fill()
    // Label above the head.
    const lx = head[0] + 40, ly = head[1] - hr * 2 - 30
    ctx.strokeStyle = A(0.45); ctx.beginPath(); seg(head[0], head[1] - hr * 2, lx, ly); seg(lx, ly, lx + 120, ly); ctx.stroke()
    TEXT(10.5, pose === 0 ? 1 : 0.75, pose === 0 ? 600 : 400); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText(label, lx + 4, ly - 3)
    TEXT(9.5, 0.5); ctx.textBaseline = 'top'; ctx.fillText(`HR ${Math.round(bpm + Math.sin(t * 0.0005 + x) * 3)} BPM`, lx + 4, ly + 3)
  }
  return `DETECTIVE MODE · 4 CONTACTS · 1 ARMED · SCAN ${String(Math.round(((sweep + 5) / 10) * 100)).padStart(3, '0')}%`
}

  if (scene.id === 'topo') {
    sep()
    btn('Cycle', cityPick === -1, () => { cityPick = -1; start = performance.now() })
    CITY_IDS.forEach((id, i) => btn(CITY_LABELS[id], cityPick === i, () => { cityPick = i; start = performance.now() }))
  }
  sep()
  LAYOUTS.forEach(([id, label]) => btn(label, layout === id, () => { layout = id; document.body.dataset.layout = id }))
  sep()
  btn(quoteOn ? 'Quote: on' : 'Quote: off', quoteOn, () => { quoteOn = !quoteOn; document.getElementById('quote').classList.toggle('hidden', !quoteOn) })
  btn(panelOn ? 'Unlock box: on' : 'Unlock box: off', panelOn, () => { panelOn = !panelOn; document.getElementById('panel').classList.toggle('hidden', !panelOn) })
}
document.getElementById('quote').classList.toggle('hidden', !quoteOn)
renderBar()

let start = performance.now(), last = 0
function frame(now) {
  requestAnimationFrame(frame)
  if (now - last < 1000 / 30) return
  last = now
  const t = now - start
  document.getElementById('gl').style.visibility = scene.three ? 'visible' : 'hidden'
  if (scene.three) ctx.clearRect(0, 0, W, H)
  else { ctx.fillStyle = rgba(BG, 1); ctx.fillRect(0, 0, W, H) }
  credit = ''
  const footer = scene.draw(t)
  vignette(scene.three ? 0.55 : 0.65)
  hud(t, footer)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
